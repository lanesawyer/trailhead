[book]
title = "Trailhead"
description = "Headless, agent-native task engine and software factory"
src = "docs"
language = "en"

[build]
build-dir = "book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js"]
git-repository-url = "https://github.com/lanesawyer/trailhead"
edit-url-template = "https://github.com/lanesawyer/trailhead/edit/main/{path}"
