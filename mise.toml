[vars]
# The engine `mise run docker-up` starts.
docker_host = "unix://{{env.HOME}}/.lima/trailhead/sock/docker.sock"

[tools]
docker-cli = "latest"
fnox = { version = "latest", workflow = "release.yml" }
lima = "latest"
mdbook = "0.5.4"
# Not in the mise registry; the preprocessor ships prebuilt binaries on GitHub (0.16 can't act as an mdBook 0.5 preprocessor, so only its bundled mermaid.min.js is used; see the docs tasks).
"github:badboy/mdbook-mermaid" = "0.16"
rust = "latest"

[tasks.test-live-sprites]
description = "Run the Sprites Compute test against the real API (creates and destroys one Sprite)"
run = "fnox exec -- cargo test -p trailhead-compute-sprites --test live -- --ignored --nocapture"

[tasks.test-live-daemon]
description = "Start the daemon in a real Sprite and drive it over iroh (creates and destroys one Sprite)"
run = [
  "cargo build --release -p trailhead-daemon --bin trailhead-daemon",
  "TRAILHEAD_DAEMON_BIN={{config_root}}/target/release/trailhead-daemon fnox exec -- cargo test -p trailhead-daemon --test live -- --ignored --nocapture",
]

[tasks.factory]
description = "Run the server from this checkout in the foreground, with the factory's log on the terminal (stop the background server first; the user config's `[factory] repos` says what it runs; SPRITES_TOKEN from the environment, fnox or `factory login`)"
run = [
  "cargo build --release -p trailhead-daemon --bin trailhead-daemon",
  "cargo build --release -p trailhead --features docker",
  "TRAILHEAD_DAEMON={{config_root}}/target/release/trailhead-daemon {{config_root}}/target/release/trailhead factory run",
]

[tasks.docker-up]
description = "Start the Docker engine for local sandboxes: rootless Docker in a lima VM, no host mounts (on Linux it needs qemu and /dev/kvm)"
run = """
if limactl list -q | grep -qx trailhead; then
  limactl start --tty=false trailhead
else
  limactl start --tty=false --name=trailhead --cpus=4 --memory=8 --disk=60 --mount-none template:docker
fi
"""

[tasks.docker-down]
description = "Stop the local sandboxes' Docker VM"
run = "limactl stop trailhead"

[tasks.docker-image]
description = "Build the sandbox image the Docker Compute starts by default (trailhead-sandbox:latest)"
env = { DOCKER_HOST = "{{vars.docker_host}}" }
run = "docker build -t trailhead-sandbox:latest crates/trailhead-compute-docker/image"

[tasks.test-live-mise]
description = "Install a [stack] with mise in a real Sprite and check a repo asking for node 26 gets it (creates and destroys one Sprite)"
run = [
  "cargo build --release -p trailhead-daemon --bin trailhead-daemon",
  "TRAILHEAD_DAEMON_BIN={{config_root}}/target/release/trailhead-daemon fnox exec -- cargo test -p trailhead-daemon --test live_mise -- --ignored --nocapture",
]

[tasks.test-live-docker]
description = "Run the Docker Compute and gateway tests against the lima VM's engine (creates and destroys small containers and their gateway; needs `mise run docker-image`)"
env = { DOCKER_HOST = "{{vars.docker_host}}" }
run = [
  "cargo build -j 4 --release -p trailhead-daemon --bin trailhead-daemon",
  "TRAILHEAD_DAEMON_BIN={{config_root}}/target/release/trailhead-daemon cargo test -j 4 -p trailhead-compute-docker --test live -- --ignored --nocapture --test-threads=1 --skip credentials",
  "TRAILHEAD_DAEMON_BIN={{config_root}}/target/release/trailhead-daemon cargo test -j 4 -p trailhead-compute-docker --test live_daemon -- --ignored --nocapture",
]

[tasks.test-live-docker-credentials]
description = "With real credentials from fnox, in the lima VM: one small model call on the subscription through the gateway's proxy, and one read-only GitHub call through its connection"
env = { DOCKER_HOST = "{{vars.docker_host}}" }
run = [
  "cargo build -j 4 --release -p trailhead-daemon --bin trailhead-daemon",
  "TRAILHEAD_DAEMON_BIN={{config_root}}/target/release/trailhead-daemon fnox exec -- cargo test -j 4 -p trailhead-compute-docker --test live credentials -- --ignored --nocapture --test-threads=1",
]

[tasks.test-live-docker-factory]
description = "A task end to end on Docker sandboxes through the gateway, worker and reviewer, on a scratch repo in TRAILHEAD_LIVE_REPO (real model calls and a real PR; needs `mise run docker-image`, and no other factory on the engine)"
env = { DOCKER_HOST = "{{vars.docker_host}}" }
run = [
  "cargo build -j 4 --release -p trailhead-daemon --bin trailhead-daemon",
  "cargo build -j 4 -p trailhead --features docker",
  "TRAILHEAD_BIN={{config_root}}/target/debug/trailhead TRAILHEAD_DAEMON_BIN={{config_root}}/target/release/trailhead-daemon fnox exec -- cargo test -j 4 -p trailhead-factory-server --features docker --test live_docker -- --ignored --nocapture",
]

[tasks.install]
description = "Reinstall trailhead (the server runs the factory) and the daemon from this checkout (cargo install takes one --path at a time)"
run = """
set -e
# -j 4: full parallelism has OOM-killed a dev machine.
cargo install --locked -j 4 --features docker --path crates/trailhead
cargo install --locked -j 4 --path crates/trailhead-daemon
# Anchored so this script's own command line doesn't match.
if pgrep -f "^${CARGO_HOME:-$HOME/.cargo}/bin/trailhead-factory run" >/dev/null; then
  echo
  echo "The old standalone trailhead-factory is still running. The server runs the factory now: Ctrl-C it once to drain, and the server's control plane takes over."
fi
"""

[tasks.docs-mermaid]
description = "Unpack mermaid.min.js (git-ignored), which book.toml loads as additional-js"
# mermaid.min.js is bundled in the mdbook-mermaid binary; `install` unpacks it. It runs in a scratch directory because
# mdbook-mermaid 0.16 can't read mdBook 0.5's preprocessor input, so book.toml must not register it as a preprocessor.
# mermaid-render.js turns the ```mermaid blocks into diagrams in the browser, so they render offline.
run = "d=$(mktemp -d) && printf '[book]\\ntitle = \"x\"\\n' > \"$d/book.toml\" && mdbook-mermaid install \"$d\" && cp \"$d/mermaid.min.js\" . && rm -r \"$d\""

[tasks.docs]
description = "Build the docs (docs/) into a book with mdBook; `mise run docs-serve` previews it"
depends = ["docs-mermaid"]
run = "mdbook build"

[tasks.docs-serve]
description = "Preview the docs with `mdbook serve`, unpacking mermaid.min.js first so a fresh checkout works"
depends = ["docs-mermaid"]
run = "mdbook serve"

[tasks.lookout-install]
description = "Install Lookout with its desktop entry and icons (~/.cargo/bin, ~/.local/share), so the dock shows the TL icon (the desktop entry's name must match the window's app id, `lookout`)"
run = """
cargo install --path clients/trailhead-lookout --locked
install -Dm644 clients/trailhead-lookout/assets/lookout.desktop ~/.local/share/applications/lookout.desktop
for size in 32 64 128 256; do
  install -Dm644 clients/trailhead-lookout/assets/icon/$size.png ~/.local/share/icons/hicolor/${size}x${size}/apps/lookout.png
done
install -Dm644 clients/trailhead-lookout/assets/icon/lookout.svg ~/.local/share/icons/hicolor/scalable/apps/lookout.svg
update-desktop-database ~/.local/share/applications 2>/dev/null || true
gtk-update-icon-cache -q -t ~/.local/share/icons/hicolor 2>/dev/null || true
"""
