# Secrets for local development, resolved by `fnox exec` (https://fnox.jdx.dev).
# Needs a Bitwarden Secrets Manager machine-account token in BWS_ACCESS_TOKEN
# with read access to the Trailhead project.

[providers.bws]
type = "bitwarden-sm"
project_id = "a96f8061-409e-4eaa-b76b-b4f0002a6733" # Trailhead

[secrets]
SPRITES_TOKEN = { provider = "bws", value = "SPRITES_TOKEN" }
# Subscription mode (docs/factory/sandbox.md): `claude setup-token`, for trailhead-factory.
CLAUDE_CODE_OAUTH_TOKEN = { provider = "bws", value = "CLAUDE_CODE_OAUTH_TOKEN" }
# Lets trailhead-factory see merged and closed PRs (docs/factory/operating.md): a fine-grained token for
# lanesawyer/trailhead with Pull requests: Read-only.
GITHUB_TOKEN = { provider = "bws", value = "GITHUB_TOKEN" }
# The Docker gateway's GitHub token (docs/factory/operating.md): a fine-grained token with Contents,
# Pull requests and Issues: Read and write.
GITHUB_WRITER_TOKEN = { provider = "bws", value = "GITHUB_TOKEN" }
