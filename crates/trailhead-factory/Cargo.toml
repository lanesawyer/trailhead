[package]
name = "trailhead-factory"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = false
description = "Trailhead factory: domain types, daemon contract, the five plugin traits, config schema"

[lints]
workspace = true

[features]
default = ["rust", "python", "node", "go"]
# Programming-language support (`crate::language`): each is one `Language` and nothing else names the language.
rust = []
python = []
node = []
go = []

[dependencies]
trailhead-model.workspace = true
async-trait.workspace = true
bytes = { workspace = true, features = ["serde"] }
globset.workspace = true
serde.workspace = true

serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
