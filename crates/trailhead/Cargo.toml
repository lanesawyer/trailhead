[package]
name = "trailhead"
description = "Trailhead CLI and server binary"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[features]
default = ["factory", "rust", "python", "node", "go"]
# Programming languages the factory knows (`crates/trailhead-factory/src/language.rs`): leave one out of a build for a stack without it.
rust = ["trailhead-factory-server?/rust"]
python = ["trailhead-factory-server?/python"]
node = ["trailhead-factory-server?/node"]
go = ["trailhead-factory-server?/go"]
# The factory's control plane in `trailhead serve` (docs/factory/server-control-plane.md).
factory = ["trailhead-server/factory", "dep:trailhead-factory-server", "dep:trailhead-wire", "dep:iroh"]
docker = ["factory", "trailhead-server/docker"]

[dependencies]
trailhead-factory-server = { workspace = true, optional = true }
trailhead-client = { workspace = true, features = ["http"] }
trailhead-core.workspace = true
trailhead-server.workspace = true
trailhead-builder.workspace = true
# For `trailhead app from`, which dials another machine's server: with the factory, never in the engine alone.
trailhead-wire = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
trailhead-log.workspace = true
tokio = { workspace = true, features = ["process", "io-std", "io-util"] }
clap.workspace = true
reqwest.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
jiff.workspace = true
toml.workspace = true


[dev-dependencies]
trailhead-factory.workspace = true
tempfile.workspace = true
