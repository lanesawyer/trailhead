[package]
name = "trailhead"
description = "Trailhead CLI and server binary"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
trailhead-core.workspace = true
trailhead-server.workspace = true
tokio = { workspace = true, features = ["process", "io-std", "io-util"] }
clap.workspace = true
reqwest.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
jiff.workspace = true
tracing-subscriber.workspace = true
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3"
