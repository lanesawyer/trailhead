[package]
name = "trailhead-factory-host"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = false
description = "Runs the Trailhead factory's control plane next to a local Trailhead server"

[[bin]]
name = "trailhead-factory"
path = "src/main.rs"

[features]
# The Docker Compute (`[compute] kind = "docker"`).
docker = ["dep:trailhead-compute-docker"]

[dependencies]
trailhead-core.workspace = true
trailhead-server.workspace = true
trailhead-factory.workspace = true
trailhead-control.workspace = true
trailhead-daemon = { workspace = true, features = ["net"] }
trailhead-compute-sprites.workspace = true
trailhead-compute-docker = { workspace = true, optional = true }
trailhead-provider-anthropic.workspace = true
clap.workspace = true
hex.workspace = true
iroh.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
