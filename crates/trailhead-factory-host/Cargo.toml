[package]
name = "trailhead-factory-host"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = false
description = "Runs the Trailhead factory's control plane next to a local Trailhead server"

[[bin]]
name = "trailhead-factory"
path = "src/main.rs"

[features]
# The Docker Compute (`[compute] kind = "docker"`).
docker = ["trailhead-factory-server/docker", "dep:trailhead-compute-docker"]

[dependencies]
trailhead-factory-server.workspace = true
# Only for the live Docker test, which needs the feature anyway.
trailhead-compute-docker = { workspace = true, optional = true }
clap.workspace = true
tokio.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
serde_json.workspace = true
trailhead-factory.workspace = true
tokio = { workspace = true, features = ["process"] }

[[test]]
name = "live_docker"
required-features = ["docker"]
