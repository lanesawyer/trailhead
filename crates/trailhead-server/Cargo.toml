[package]
name = "trailhead-server"
description = "Trailhead's HTTP server: REST under /v1"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
trailhead-core = { workspace = true, features = ["openapi"] }
axum.workspace = true
tokio = { workspace = true, features = ["net", "signal", "fs"] }
tower-http.workspace = true
utoipa.workspace = true
futures-util.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
directories.workspace = true
rmcp.workspace = true
keyring.workspace = true
reqwest.workspace = true
http.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
