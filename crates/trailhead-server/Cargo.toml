[package]
name = "trailhead-server"
description = "Trailhead's HTTP server: REST under /v1"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Runs the factory's control plane in the server when the user config's `[factory] repos` lists a repo
# (docs/factory/server-control-plane.md). Off by default until the CLI's install covers it (TRAIL-1073).
factory = ["dep:trailhead-factory-server"]
# The Docker compute for the factory.
docker = ["factory", "trailhead-factory-server/docker"]

[dependencies]
trailhead-factory-server = { workspace = true, optional = true }
trailhead-client.workspace = true
trailhead-core = { workspace = true, features = ["openapi"] }
axum.workspace = true
tokio = { workspace = true, features = ["net", "signal", "fs"] }
tower-http.workspace = true
utoipa.workspace = true
futures-util.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
jiff.workspace = true
rmcp.workspace = true
reqwest.workspace = true
http.workspace = true


[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
