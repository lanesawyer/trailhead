[package]
name = "trailhead-connector"
description = "The kit a Trailhead connector is written against: its manifest, feeds, a host-checked HTTP client, replayable tests, state, secrets and settings"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
trailhead-model.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }
trailhead-core.workspace = true
trailhead-server.workspace = true

# The connector a planner points at: one JSON list from one host, handed over as one feed, with a replay test.
[[example]]
name = "todo_list"
path = "examples/todo_list/main.rs"
test = true
