[package]
name = "trailhead-daemon"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = false
description = "Trailhead factory daemon: runs agents in a sandbox and speaks the daemon contract over iroh"

[lints]
workspace = true

[features]
default = ["net", "rust", "python", "node", "go"]
# Programming languages (`trailhead-factory`'s `language` module); `rust` also carries `trim-cargo`.
rust = ["trailhead-factory/rust"]
python = ["trailhead-factory/python"]
node = ["trailhead-factory/node"]
go = ["trailhead-factory/go"]
# The iroh transport. The testkit turns it off to reuse the runner in-process.
net = ["dep:iroh", "dep:trailhead-wire", "dep:clap", "dep:tracing-subscriber", "dep:trailhead-log", "dep:trailhead-plugins", "dep:trailhead-codehost-github", "dep:reqwest", "dep:trailhead-tracker-rest"]

[dependencies]
base64.workspace = true
trailhead-factory.workspace = true
trailhead-log = { workspace = true, optional = true }
async-trait.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["fs", "process", "io-util", "signal", "net"] }
tracing.workspace = true
iroh = { workspace = true, optional = true }
trailhead-wire = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
trailhead-codehost-github = { workspace = true, optional = true }
trailhead-tracker-rest = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
trailhead-plugins = { workspace = true, optional = true }

[[bin]]
name = "trailhead-daemon"
required-features = ["net"]

[dev-dependencies]
trailhead-plugins.workspace = true
trailhead-wire.workspace = true
trailhead-testkit.workspace = true
trailhead-tracker-rest.workspace = true
trailhead-control.workspace = true
tempfile.workspace = true
trailhead-compute-sprites.workspace = true
trailhead-core.workspace = true
trailhead-server.workspace = true
axum.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
