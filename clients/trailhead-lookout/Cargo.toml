[package]
name = "trailhead-lookout"
description = "Lookout, the Trailhead factory's Bevy client"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "lookout"
path = "src/main.rs"

[dependencies]
# Default features pull in audio (alsa), gamepads (udev), 3D and more; take only what a UI needs.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "bevy_state",
    "multi_threaded",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "bevy_scene",
    # Paste into text fields, and copy the `allow` command (arboard, over X11; no system libraries).
    "system_clipboard",
    "bevy_winit",
    "default_font",
    "custom_cursor",
    "x11",
] }
trailhead-ui.workspace = true
trailhead-client.workspace = true
trailhead-model.workspace = true
trailhead-wire.workspace = true
iroh.workspace = true
tokio = { workspace = true, features = ["time"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
jiff.workspace = true
toml.workspace = true
trailhead-factory.workspace = true
directories.workspace = true
tracing.workspace = true
# The window icon goes through winit (bevy 0.20 has no icon field on `Window`); png decodes the embedded icon and writes the committed ones.
winit = { version = "0.30", default-features = false }
png = "0.18"

[dev-dependencies]
trailhead-core.workspace = true
trailhead-server.workspace = true
axum.workspace = true
tempfile.workspace = true
