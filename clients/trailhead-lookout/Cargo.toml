[package]
name = "trailhead-lookout"
description = "Lookout, the Trailhead factory's Bevy client"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Default features pull in audio (alsa), gamepads (udev), 3D and more; take only what a UI needs.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "bevy_state",
    "multi_threaded",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "bevy_scene",
    # Paste into text fields, and copy the `allow` command (arboard, over X11; no system libraries).
    "system_clipboard",
    "bevy_winit",
    "default_font",
    "custom_cursor",
    "x11",
    # The trail map's peak: lit meshes, a 3D camera, and clicks on its meshes (TRAIL-1163). The kit leaves these out.
    "bevy_pbr",
    "mesh_picking",
] }
trailhead-ui.workspace = true
trailhead-shell.workspace = true
trailhead-client = { workspace = true, features = ["http"] }
trailhead-model.workspace = true
trailhead-wire.workspace = true
iroh.workspace = true
tokio = { workspace = true, features = ["time"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
jiff.workspace = true
trailhead-factory.workspace = true
tracing.workspace = true

[dev-dependencies]
trailhead-ui = { workspace = true, features = ["test-support"] }
# The fixtures, `testing::server` for the factory link's tests, and `testing::shot` for `tests/shots.rs`.
trailhead-shell = { workspace = true, features = ["test-server", "shots"] }
