[package]
name = "trailhead-shell"
description = "The Trailhead shell: one window that holds several apps, and the contract an app is written against"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# What tests of apps built on the shell need: the fixtures for mirrored records, and hooks to set up state a test
# checks.
test-support = []

[dependencies]
# Default features pull in audio (alsa), gamepads (udev), 3D and more; take only what a window of UI needs.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "bevy_state",
    "multi_threaded",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "bevy_scene",
    # Paste into text fields, and copy to the clipboard (arboard, over X11; no system libraries).
    "system_clipboard",
    "bevy_winit",
    "default_font",
    "custom_cursor",
    "x11",
] }
trailhead-ui.workspace = true
trailhead-client = { workspace = true, features = ["http"] }
trailhead-model.workspace = true
tokio = { workspace = true, features = ["time"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true

[dev-dependencies]
trailhead-core.workspace = true
trailhead-server.workspace = true
axum.workspace = true
tempfile.workspace = true
