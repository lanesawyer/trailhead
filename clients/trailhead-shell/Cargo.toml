[package]
name = "trailhead-shell"
description = "The Trailhead shell: one window that holds several apps, and the contract an app is written against"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# What tests of apps built on the shell need: `testing`'s test apps with the connection's pieces and no net thread,
# the fixtures for mirrored records, and hooks to set up state a test checks. Pulls in nothing the shell doesn't.
test-support = []
# `testing::server`: an in-process Trailhead server to go live against, which brings the task engine and the server.
test-server = ["test-support", "dep:trailhead-core", "dep:trailhead-server", "dep:axum", "dep:tempfile", "tokio/net"]

[dependencies]
# Default features pull in audio (alsa), gamepads (udev), 3D and more; take only what a window of UI needs.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "bevy_state",
    "multi_threaded",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "bevy_scene",
    # Paste into text fields, and copy to the clipboard (arboard, over X11; no system libraries).
    "system_clipboard",
    "bevy_winit",
    "default_font",
    "custom_cursor",
    "x11",
] }
trailhead-ui.workspace = true
trailhead-client = { workspace = true, features = ["http"] }
trailhead-model.workspace = true
trailhead-wire.workspace = true
iroh.workspace = true
tokio = { workspace = true, features = ["time"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
directories.workspace = true
tracing.workspace = true
# The window icon goes through winit (bevy 0.20 has no icon field on `Window`); png decodes the embedded icon and writes the committed ones.
winit = { version = "0.30", default-features = false }
png = "0.18"
trailhead-core = { workspace = true, optional = true }
trailhead-server = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
# The shell's own tests use the test support and the server too.
trailhead-shell = { workspace = true, features = ["test-server"] }
