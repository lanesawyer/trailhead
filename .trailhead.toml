# This repo's defaults. `agent` and `project` are for the CLI (who interactive tools act as, and the default -p); the
# factory reads `project` too, and everything under [factory] (docs/factory/). `trailhead-factory run` finds this file
# the way the CLI does, upwards from the working directory.
agent = "claude"
project = "TRAIL"

[factory.repo]
# owner and name come from the git remote; the project is the one above.
max_sandboxes = 2
# Until TRAIL-159 and TRAIL-172 stop infrastructure blips counting, leave room for a few.
max_attempts = 5
# Only subtasks of this task are the factory's work.
queue = "TRAIL-102"

[factory.stack]
tools = { rust = "stable" }

[factory.checks]
# Runs while install egress is open; the agent's phase can't reach crates.io.
setup = "cargo fetch --locked && cargo build --all-targets --locked"
fmt = "cargo fmt --all --check"
lint = "cargo clippy --all-targets -- -D warnings"
test = "cargo test"

[factory.egress]
# crates.io and rustup while installing dependencies; nothing extra while the agent works.
install = ["crates.io", "index.crates.io", "static.crates.io", "static.rust-lang.org"]

[factory.grades]
# Path globs that raise a PR to at least this grade (docs/factory/review.md#grades); the task's own grade is the floor.
2 = ["crates/*/src/**", "crates/*/build.rs", "crates/*/benches/**", "crates/*/examples/**", "cliff.toml", "rustfmt.toml"]
3 = ["**/Cargo.toml", "Cargo.lock", "**/migrations/**"]
4 = [".github/**", "fnox.toml", "mise.toml", "AGENTS.md", ".claude/**", ".mcp.json", "skills/**", ".trailhead.toml", "LICENSE"]
max_lines = 600          # bigger diffs are at least grade 3

[factory.gates]
# What each grade needs before the merger approves it (docs/factory/review.md#gate-policy). Only grade 1 auto-merges, to start.
1 = { require = ["checks", "ci"], auto_merge = true }
2 = { require = ["checks", "ci", "agent_review"], auto_merge = false }
3 = { require = ["checks", "ci", "agent_review", "human"], auto_merge = false }
4 = { require = ["checks", "ci", "human"], auto_merge = false }

[factory.merge]
# On: squash-merges an approved PR whose grade has auto_merge (grade 1 here), or that Lane approved. To stop it, set
# "shadow" (says what it would do, merges nothing) and restart the factory; Ctrl-C drains (docs/factory/operating.md).
mode = "on"

[factory.daemon]
# Chasing TRAIL-187 (run not found on the daemon after a reattach).
log = "info,iroh=debug"

[factory.usage]
# Subscription usage windows, in percent: at or past these, no new runs start until the window resets, leaving
# room for whatever else shares the plan (docs/factory/budgets.md).
pause_at = { five_hour = 80, seven_day = 90 }

[factory.profiles.worker]
role = "worker"
adapter = "claude-code"
provider = "anthropic"
model = "sonnet"
budget = { usd = 5, minutes = 60, steps = 60 }

[factory.profiles.reviewer]
role = "reviewer"
adapter = "claude-code"
provider = "anthropic"
model = "opus"
budget = { usd = 2, minutes = 20, steps = 30 }
