name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0. Leave empty to use the next version git-cliff calculates from the commits.
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then tag="v${INPUT#v}"; else tag=$(git cliff --bumped-version); fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a vX.Y.Z version"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The workspace version and the path dependencies' versions must move together for cargo publish.
      - name: Set crate versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -E -i \
            -e "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" \
            -e "s/^(trailhead-(core|server) = \{ path = \"[^\"]+\", version = \")[^\"]+/\1$VERSION/" \
            Cargo.toml
          if [ "$(grep -c "version = \"$VERSION\"" Cargo.toml)" != 3 ]; then
            echo "::error::expected the workspace and both path dependencies at $VERSION"; exit 1
          fi
          cargo update --workspace

      - name: Update changelog
        run: git cliff --tag "${{ steps.version.outputs.tag }}" -o CHANGELOG.md

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:main "$TAG"

  # Tags pushed with GITHUB_TOKEN don't trigger other workflows, so call publish directly.
  publish:
    needs: release
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
