name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0. Leave empty to use the next version git-cliff calculates from the commits.
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then tag="v${INPUT#v}"; else tag=$(git cliff --bumped-version); fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a vX.Y.Z version"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The workspace version and the path dependencies' versions must move together for cargo publish.
      - name: Set crate versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -E -i \
            -e "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" \
            -e "s/^(trailhead-(core|server) = \{ path = \"[^\"]+\", version = \")[^\"]+/\1$VERSION/" \
            Cargo.toml
          if [ "$(grep -c "version = \"$VERSION\"" Cargo.toml)" != 3 ]; then
            echo "::error::expected the workspace and both path dependencies at $VERSION"; exit 1
          fi
          cargo update --workspace

      - name: Update changelog
        run: git cliff --unreleased --tag "${{ steps.version.outputs.tag }}" --prepend CHANGELOG.md

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:main "$TAG"

  # Built before publishing so a broken build stops the release before anything reaches crates.io.
  binaries:
    needs: release
    strategy:
      matrix:
        include:
          # The oldest Ubuntu runners, so the binaries run on glibc 2.35 and newer.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p trailhead --target ${{ matrix.target }}
      # cargo-binstall finds these through [package.metadata.binstall] in crates/trailhead/Cargo.toml.
      - name: Package
        env:
          NAME: trailhead-${{ needs.release.outputs.tag }}-${{ matrix.target }}
        run: |
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/trailhead" LICENSE README.md "dist/$NAME/"
          cd dist
          archive="$NAME.tar.gz"
          tar czf "$archive" "$NAME"
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  crates-io:
    needs: [release, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      # Publishes trailhead-core, trailhead-server and trailhead in dependency order.
      - run: cargo publish --locked -p trailhead-core -p trailhead-server -p trailhead
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: [release, crates-io]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: git cliff --latest --strip header -o RELEASE_NOTES.md
      - run: gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag dist/*
        env:
          TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
