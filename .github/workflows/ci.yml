name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The live Docker test builds only with this feature, and nothing else turns it on.
      - run: cargo clippy -p trailhead-factory-host --features docker --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # Lookout (clients/trailhead-lookout) is outside default-members, so the jobs above skip Bevy.
  # Its own job keeps Bevy's build in its own rust-cache. It always runs, never filtered by path.
  # With the jobs above, the workspace is covered: default members there, the rest here.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # No system packages: it builds without alsa, udev or wayland headers (see its README).
      - run: cargo clippy -p trailhead-lookout --all-targets --locked -- -D warnings
      - run: cargo test -p trailhead-lookout --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Only the published crates; the factory crates are publish = false until they're ready.
      - run: cargo package --locked -p trailhead-core -p trailhead-server -p trailhead
      # rust-cache's cleanup trips over the unpacked crates and logs ENOENT errors.
      - if: always()
        run: rm -rf target/package
