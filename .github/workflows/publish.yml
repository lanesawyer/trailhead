name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Publishes trailhead-core, trailhead-server and trailhead in dependency order.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: crates-io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - run: git cliff --latest --strip header -o RELEASE_NOTES.md
      - run: gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
