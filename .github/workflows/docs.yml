name: Docs

on:
  pull_request:
    paths: [docs/**, book.toml, mise.toml, .github/workflows/docs.yml]
  push:
    branches: [main]
    paths: [docs/**, book.toml, mise.toml, .github/workflows/docs.yml]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: mdbook github:badboy/mdbook-mermaid
      - run: mise run docs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: book

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
