name: Docs

on:
  pull_request:
    paths: [docs/**, book.toml, mise.toml, .github/workflows/docs.yml]
  push:
    branches: [main]
    paths: [docs/**, book.toml, mise.toml, .github/workflows/docs.yml]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook (the version mise.toml pins)
        run: |
          v=$(sed -n 's/^mdbook = "\(.*\)"$/\1/p' mise.toml)
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v$v/mdbook-v$v-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: mdbook build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: book

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
