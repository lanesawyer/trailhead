[workspace]
resolver = "3"
members = ["crates/*", "clients/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"
authors = ["Lane Sawyer"]
repository = "https://github.com/lanesawyer/trailhead"
homepage = "https://github.com/lanesawyer/trailhead"
readme = "README.md"
keywords = ["tasks", "agents", "mcp", "sqlite", "cli"]
categories = ["command-line-utilities", "development-tools", "web-programming::http-server"]

[workspace.dependencies]
libsql = { version = "0.10", default-features = false, features = ["core", "remote", "tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = "1"
globset = "0.4"
uuid = { version = "1", features = ["v7", "serde"] }
base64 = "0.22"
thiserror = "2"
sha2 = "0.11"
getrandom = "0.4"
hex = "0.4"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
anyhow = "1"
async-trait = "0.1"
toml = "1"
trailhead-log = { path = "crates/trailhead-log", version = "0.1.0" }
trailhead-model = { path = "crates/trailhead-model", version = "0.1.0" }
trailhead-core = { path = "crates/trailhead-core", version = "0.1.0" }
trailhead-client = { path = "crates/trailhead-client", version = "0.1.0" }
trailhead-server = { path = "crates/trailhead-server", version = "0.1.0" }
trailhead-factory = { path = "crates/trailhead-factory" }
trailhead-testkit = { path = "crates/trailhead-testkit" }
trailhead-control = { path = "crates/trailhead-control" }
trailhead-daemon = { path = "crates/trailhead-daemon", default-features = false }
trailhead-wire = { path = "crates/trailhead-wire" }
trailhead-plugins = { path = "crates/trailhead-plugins" }
trailhead-harness-claude-code = { path = "crates/trailhead-harness-claude-code" }
trailhead-compute-sprites = { path = "crates/trailhead-compute-sprites" }
trailhead-compute-docker = { path = "crates/trailhead-compute-docker" }
trailhead-codehost-github = { path = "crates/trailhead-codehost-github" }
trailhead-provider-anthropic = { path = "crates/trailhead-provider-anthropic" }
trailhead-factory-host = { path = "crates/trailhead-factory-host" }
trailhead-factory-server = { path = "crates/trailhead-factory-server" }
trailhead-ui = { path = "clients/trailhead-ui" }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
http = "1"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-always"] }
utoipa = { version = "6", features = ["uuid", "jiff_0_2"] }
keyring = "4"
hmac = "0.13"
iroh = "1.4"
tempfile = "3"
bollard = "0.21"
tar = "0.4"

[profile.dev]
# Line tables only: backtraces keep file:line, but builds, links and target/ shrink a lot.
debug = "line-tables-only"

[profile.dev.package."*"]
# None for dependencies: linking Bevy's test binaries ran a 5 GiB sandbox VM out of memory (TRAIL-754).
debug = false
# Unoptimized Bevy and parley made Lookout lag behind typing and pasting (TRAIL-781). Our own crates stay at 0.
opt-level = 2

[profile.ci]
# CI only checks and tests, so it builds the quickest way: no debug info anywhere, and dependencies unoptimized, since
# dev's optimized ones (for Lookout's sake) made every CI run compile Bevy at opt-level 2 (TRAIL-803).
inherits = "dev"
debug = false

[profile.ci.package."*"]
debug = false
opt-level = 0
