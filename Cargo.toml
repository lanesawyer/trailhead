[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
libsql = { version = "0.10", default-features = false, features = ["core", "remote", "tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
sha2 = "0.11"
getrandom = "0.4"
hex = "0.4"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
anyhow = "1"
trailhead-core = { path = "crates/trailhead-core" }
trailhead-server = { path = "crates/trailhead-server" }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
http = "1"
futures-util = { version = "0.3", default-features = false }
jiff = "0.2"
utoipa = { version = "6", features = ["uuid", "time"] }
keyring = "4"
